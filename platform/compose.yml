services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ocasio
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: ocasio_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ocasio_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocasio -d ocasio_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8035:8025"
volumes:
  ocasio_postgres:
